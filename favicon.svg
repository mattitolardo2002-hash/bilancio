<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Fondo: blu profondo, più chiaro in alto -->
    <linearGradient id="fondo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a7ff0"/>
      <stop offset="0.45" stop-color="#1a4bb0"/>
      <stop offset="1" stop-color="#0a1c46"/>
    </linearGradient>
    <!-- Luce morbida dall'alto a sinistra -->
    <radialGradient id="luce" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Bordo di luce del vetro -->
    <linearGradient id="bordo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Barre: vetro chiaro -->
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d3ff"/>
    </linearGradient>
    <linearGradient id="barraTenue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#9fc0ff" stop-opacity="0.38"/>
    </linearGradient>
    <!-- Linea di tendenza -->
    <linearGradient id="linea" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fc2ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="alone" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="ombraIcona" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="ombraBarre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04112e" flood-opacity="0.45"/>
    </filter>
    <clipPath id="forma"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Forma dell'icona con ombra (griglia standard di macOS: 824 su 1024) -->
  <g filter="url(#ombraIcona)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fondo)"/>
  </g>
  <g clip-path="url(#forma)">
    <rect x="100" y="100" width="824" height="824" fill="url(#luce)"/>
    <!-- Griglia del grafico, appena accennata -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="4">
      <line x1="100" y1="420" x2="924" y2="420"/>
      <line x1="100" y1="560" x2="924" y2="560"/>
      <line x1="100" y1="700" x2="924" y2="700"/>
    </g>
    <!-- Base del grafico -->
    <line x1="232" y1="772" x2="792" y2="772" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#bordo)" stroke-width="4"/>

  <!-- Tre barre che crescono -->
  <g filter="url(#ombraBarre)">
    <rect x="262" y="572" width="118" height="200" rx="30" fill="url(#barra)" fill-opacity="0.45"/>
    <rect x="453" y="470" width="118" height="302" rx="30" fill="url(#barra)" fill-opacity="0.72"/>
    <rect x="644" y="356" width="118" height="416" rx="30" fill="url(#barra)"/>
  </g>
  <!-- Riflesso sulle barre -->
  <g fill="#ffffff" fill-opacity="0.35">
    <rect x="276" y="586" width="20" height="150" rx="10"/>
    <rect x="467" y="484" width="20" height="250" rx="10"/>
    <rect x="658" y="370" width="20" height="360" rx="10"/>
  </g>

  <!-- Linea di tendenza con alone -->
  <path d="M236 548 C 320 500, 380 440, 470 430 S 610 400, 760 262" fill="none" stroke="#9fd0ff" stroke-opacity="0.45" stroke-width="26" stroke-linecap="round" filter="url(#alone)"/>
  <path d="M236 548 C 320 500, 380 440, 470 430 S 610 400, 760 262" fill="none" stroke="url(#linea)" stroke-width="15" stroke-linecap="round"/>

</svg>
